# =====================================
# SysGuard Configuration
# =====================================

PROJECT_NAME="SysGuard"
VERSION="1.0"

# Monitoring thresholds
CPU_THRESHOLD=80
MEMORY_THRESHOLD=80
DISK_THRESHOLD=80

# Backup settings
BACKUP_RETENTION_DAYS=7
BACKUP_DIR="backups"

# Logging settings
LOG_FILE="logs/sysguard.log"

# Services to monitor
SERVICES=("ssh" "nginx")

# Directories to back up
BACKUP_SOURCES=("/var/log" "/var/www/html")
